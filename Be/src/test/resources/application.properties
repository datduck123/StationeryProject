# Test configuration for unit & integration tests
jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-256-testing
jwt.expiration=86400000

# All Spring-backed tests use an isolated in-memory database. Never inherit the
# application's SQL Server datasource or execute Flyway against developer data.
spring.datasource.url=jdbc:h2:mem:stationery-tests;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS dbo
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

